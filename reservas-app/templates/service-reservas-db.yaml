apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.db.name }}
  name: {{ .Values.db.name }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: 3306-3306
      port: {{ .Values.db.port }}
      protocol: TCP
      targetPort: {{ .Values.db.port }}
  selector:
    app: {{ .Values.db.name }}
  type: {{ .Values.db.service.type }}
